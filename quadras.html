<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Placas das Quadras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{ --bg:#06102A; --navy1:#173373; --navy2:#0C1D4A; --line:rgba(120,170,255,.32); --gold:#F5B800; --muted:#B4C3E8;
  --head:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Inter',system-ui,sans-serif; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:var(--body);padding:24px 16px 40px}
header{max-width:1100px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--head);font-style:italic;font-weight:900;font-size:34px;text-transform:uppercase;margin:0;line-height:1}
h1 span{color:var(--gold)}
p{color:var(--muted);margin:6px 0 0;font-size:14px;max-width:620px;line-height:1.45}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
select,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;padding:9px 12px}
button{background:var(--gold);color:#1a1200;font-weight:700;border:0;cursor:pointer}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.sign{border-radius:18px;padding:18px 16px 16px;text-align:center;background:linear-gradient(160deg,var(--navy1),var(--navy2));border:2px solid var(--c);break-inside:avoid}
.sign .top{font-family:var(--head);font-style:italic;font-weight:900;font-size:15px;letter-spacing:.5px;color:var(--gold);text-transform:uppercase}
.sign .court{font-family:var(--head);font-style:italic;font-weight:900;font-size:44px;line-height:1;margin:4px 0 2px;text-transform:uppercase}
.sign .venue{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.qr{background:#fff;border-radius:12px;padding:10px;display:inline-block;line-height:0}
.sign .cta{font-weight:700;font-size:14px;margin-top:12px}
.sign .cta small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:3px}
@media print{ body{background:#fff;color:#000;padding:0} header{display:none} .sign{background:#fff;color:#000;border-width:3px} .sign .venue,.sign .cta small{color:#333} .sign .top{color:#a37a00} }
</style>
</head>
<body>
<header>
  <div>
    <h1>Placas de votação · <span>12 quadras</span></h1>
    <p>Cada quadra tem um QR fixo. Na arena, o participante abre <b>Votação → Escanear QR da quadra</b> no app e vota numa das duas baterias do jogo em andamento.</p>
  </div>
  <div style="display:flex;gap:10px;align-items:flex-end">
    <label>Momento da demonstração
      <select id="now">
        <option value="">Momento atual de cada celular</option>
        <option value="1-1440">Dia 1 · 14:40 — fase de grupos</option>
        <option value="2-1800">Dia 2 · 18:00 — quartas de final</option>
        <option value="3-1700">Dia 3 · 17:00 — finais ao vivo</option>
      </select>
    </label>
    <button onclick="print()">Imprimir</button>
  </div>
</header>
<main class="grid" id="grid"></main>
<script>
/* Mesmo token do app (index.html → courtToken) */
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const courtToken = q => hashStr('IC-QUADRA|'+q).toString(36).slice(0,6);
const POLOS = [
  { mod:'Futsal',   emoji:'⚽', cor:'#2FA84F', local:'Ginásio do Ibirapuera', q:['f1','f2','f3'] },
  { mod:'Handebol', emoji:'🤾', cor:'#FF6B1A', local:'Centro Olímpico (COTP)', q:['h1','h2','h3'] },
  { mod:'Basquete', emoji:'🏀', cor:'#E2242C', local:'Esporte Clube Sírio',    q:['b1','b2','b3'] },
  { mod:'Vôlei',    emoji:'🏐', cor:'#2E7DF6', local:'Sesc Vila Mariana',      q:['v1','v2','v3'] },
];
const base = location.href.split('#')[0].split('?')[0].replace(/quadras\.html$/, '');
function draw(){
  const now = document.getElementById('now').value;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  POLOS.forEach(p=>p.q.forEach(q=>{
    const el = document.createElement('div');
    el.className = 'sign'; el.style.setProperty('--c', p.cor);
    el.innerHTML = `<div class="top">Intercampus · Torcida que voa mais alto</div><div class="court">${p.emoji} Quadra ${q.toUpperCase()}</div><div class="venue">${p.mod} · ${p.local}</div><div class="qr"></div><div class="cta">Vote na melhor bateria 🥁<small>Abra o Intercampus App → Votação → Escanear</small></div>`;
    grid.appendChild(el);
    new QRCode(el.querySelector('.qr'), { text:`${base}#/votar?q=${q}&t=${courtToken(q)}${now?'&now='+now:''}`, width:180, height:180, colorDark:'#0A1A44', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
  }));
}
document.getElementById('now').addEventListener('change', draw);
draw();
</script>
</body>
</html>
