<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07112A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Intercampus App — Copa Universitária Multiesportiva">
<title>Intercampus App</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1B44'/%3E%3Cpath d='M20 14h24v8a12 12 0 0 1-24 0z' fill='%23F5B800'/%3E%3Cpath d='M28 34h8v8h6v6H22v-6h6z' fill='%23F5B800'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg0:#06102A; --bg1:#0A1A44; --bg2:#10265C;
  --navy1:#173373; --navy2:#0C1D4A; --line:rgba(120,170,255,.32);
  --red1:#E5283F; --red2:#A30D24;
  --gold:#F5B800; --gold2:#FFD54A; --gold3:#C58500;
  --text:#FFFFFF; --muted:#B4C3E8; --dim:#7F92C4;
  --live:#FF3B4E; --ok:#2FD07A;
  --radius:14px;
  --head:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body:'Inter', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg0);color:var(--text);font-family:var(--body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font:inherit;color:inherit}

/* ---------- layout ---------- */
.stage{height:100dvh;display:flex;justify-content:center;align-items:center;gap:56px}
.side{display:none}
.phone{position:relative;width:100%;height:100dvh;max-width:480px;overflow:hidden;background:
  radial-gradient(120% 60% at 100% 0%, rgba(40,90,200,.35), transparent 60%),
  radial-gradient(90% 50% at 0% 100%, rgba(30,70,170,.35), transparent 60%),
  linear-gradient(180deg,var(--bg1),var(--bg0));display:flex;flex-direction:column}
.phone::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.025) 0 2px, transparent 2px 22px)}
@media (min-width:960px){
  body{background:radial-gradient(80% 80% at 70% 30%, #12296a, #050c22 70%)}
  .side{display:flex;flex-direction:column;gap:22px;max-width:380px}
  .phone{width:400px;height:min(860px,94dvh);border-radius:46px;border:11px solid #05070d;
    box-shadow:0 0 0 2px #2a3550, 0 40px 90px rgba(0,0,0,.6)}
}
.side .logo{transform:scale(1.25);transform-origin:left center}
.side h2{font-family:var(--head);font-style:italic;font-weight:900;font-size:40px;line-height:1;margin:6px 0 0;text-transform:uppercase}
.side h2 span{color:var(--gold)}
.side p{color:var(--muted);line-height:1.5;margin:0}
.side .qrbox{display:flex;gap:18px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:16px}
.qr{background:#fff;padding:10px;border-radius:12px;line-height:0}
.qr img,.qr canvas{display:block}
.side .url{font-family:var(--head);font-size:18px;font-weight:700;color:var(--gold2);word-break:break-all}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding:0 14px 96px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 2px 6px}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;position:relative}
.iconbtn:active{background:rgba(255,255,255,.08)}
.iconbtn svg{width:24px;height:24px}
.dotbadge{position:absolute;top:3px;right:3px;background:var(--live);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;border:2px solid var(--bg1)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo svg{width:92px;height:30px;margin-bottom:-3px}
.logo .name{font-family:var(--head);font-style:italic;font-weight:900;font-size:27px;letter-spacing:.3px;text-transform:uppercase;
  background:linear-gradient(180deg,#fff 40%,#cfd9f5);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #071233) drop-shadow(0 0 1px #000)}
.logo .sub{font-family:var(--head);font-weight:700;font-size:10.5px;letter-spacing:.9px;color:var(--gold2);margin-top:3px;text-transform:uppercase;
  border-top:1px solid rgba(245,184,0,.5);border-bottom:1px solid rgba(245,184,0,.5);padding:2px 8px}
.ptitle{font-family:var(--head);font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.3px}

/* ---------- greeting ---------- */
.hello{display:flex;gap:14px;align-items:center;margin:10px 2px 16px}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;position:relative;overflow:hidden}
.avatar.big{width:66px;height:66px;border:3px solid var(--gold);box-shadow:0 0 0 3px rgba(245,184,0,.18)}
.hello h1{margin:0;font-size:21px;font-weight:700}
.hello p{margin:3px 0 0;color:#dfe7ff;font-size:13.5px}
.hello b{color:var(--gold);font-weight:700}

/* ---------- home grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;border-radius:var(--radius);padding:10px 10px 9px;min-height:92px;overflow:hidden;
  background:linear-gradient(160deg,var(--navy1),var(--navy2));border:1px solid var(--line);
  box-shadow:0 6px 16px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;text-align:left}
.card:active{transform:scale(.98)}
.card.red{background:linear-gradient(150deg,var(--red1),var(--red2));border-color:rgba(255,140,150,.45)}
.card.red::after,.card.gold::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(120deg, rgba(255,255,255,.07) 0 3px, transparent 3px 16px);mix-blend-mode:overlay}
.card.gold{background:linear-gradient(140deg,var(--gold2),var(--gold) 55%,var(--gold3));border-color:#ffe28a;color:#fff}
.card h3{margin:0 0 7px;font-family:var(--head);font-style:italic;font-weight:800;font-size:15px;white-space:nowrap;letter-spacing:.2px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h3 .link{font-family:var(--body);font-style:normal;font-weight:600;font-size:10px;color:var(--gold2);text-decoration:underline;text-transform:none}
.card .body{display:flex;gap:10px;align-items:center;flex:1}
.card .body svg.ic{width:32px;height:32px;flex:none}
.card .body p{margin:0;font-size:11px;line-height:1.35;color:#e5ecff;flex:1}
.card .chev{width:14px;height:14px;flex:none;opacity:.9}
.card.wide{grid-column:1/-1;min-height:0}
.tag-new{background:var(--live);color:#fff;font-family:var(--body);font-style:normal;font-weight:700;font-size:10.5px;padding:2px 8px;border-radius:10px;text-transform:none}

.nextgame{background:rgba(70,0,10,.35);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;flex:1}
.nextgame .when{font-size:10.5px;color:var(--gold2);font-weight:600}
.nextgame .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.nextgame .t{font-weight:700;font-size:12.5px;line-height:1.15}
.nextgame .ph{font-size:11px;color:#ffe3e6}
.nextgame .where{font-size:10.5px;color:#ffe3e6;display:flex;align-items:center;gap:3px}
.vs{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:700}

.friends{margin-top:10px;padding:10px 11px}
.friends .list{display:flex;justify-content:space-between;gap:6px}
.friend{display:flex;align-items:center;gap:7px;min-width:0}
.friend .avatar{width:34px;height:34px;border:2px solid rgba(255,255,255,.7)}
.friend b{font-size:12.5px;display:flex;align-items:center;gap:4px}
.friend b::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.friend small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap}
.sect{font-family:var(--head);font-style:italic;font-weight:800;font-size:15px;text-transform:uppercase;margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sect .link{font-family:var(--body);font-style:normal;font-weight:600;font-size:11.5px;color:var(--gold2);text-decoration:underline;text-transform:none}
.banner{position:relative;border-radius:var(--radius);overflow:hidden;height:118px;border:1px solid var(--line);
  background:linear-gradient(100deg,#0e2a6e 0%,#123a8e 45%,#0d2560 100%);display:flex;flex-direction:column;justify-content:center;padding:0 18px}
.banner::before{content:"";position:absolute;right:-30px;top:-20px;bottom:-20px;width:58%;transform:skewX(-22deg);
  background:linear-gradient(90deg,transparent 0 8%,var(--red1) 8% 30%,transparent 30% 36%,var(--gold) 36% 50%,transparent 50% 56%,var(--red2) 56% 100%);opacity:.95}
.banner b{position:relative;font-family:var(--head);font-style:italic;font-weight:900;font-size:44px;line-height:.9;color:var(--gold);text-shadow:0 3px 0 #5a3c00}
.banner span{position:relative;font-family:var(--head);font-style:italic;font-weight:800;font-size:16px;letter-spacing:.5px;text-transform:uppercase}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.carousel::-webkit-scrollbar{display:none}
.carousel>*{flex:0 0 92%;scroll-snap-align:center}
.banner.alt{background:linear-gradient(100deg,#5b0a17,#a30d24 55%,#c8102e)}
.banner.alt::before{background:linear-gradient(90deg,transparent 0 10%,var(--gold) 10% 22%,transparent 22% 30%,#fff 30% 34%,transparent 34%);opacity:.55}
.banner.alt b{color:#fff;text-shadow:0 3px 0 #4a0010}

/* ---------- bottom nav ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,rgba(10,26,68,.92),#071233);
  border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#dfe6ff;min-width:58px;padding:2px 0}
.nav a svg{width:23px;height:23px}
.nav a.on{color:var(--gold)}

/* ---------- inner screens ---------- */
.ihead{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 12px) 0 10px;position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg,var(--bg1) 75%,rgba(10,26,68,0));margin:0 -14px;padding-left:10px;padding-right:10px}
.ihead .ptitle{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;
  background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap}
.pill.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.pill .x{opacity:.7;margin-left:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;border:1px solid rgba(255,255,255,.6)}

/* cronograma */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.day{border-radius:12px;padding:7px 2px 6px;text-align:center;background:linear-gradient(160deg,var(--navy1),var(--navy2));border:1px solid var(--line)}
.day b{display:block;font-family:var(--head);font-style:italic;font-weight:800;font-size:17px;text-transform:uppercase;line-height:1}
.day small{font-size:10.5px;color:var(--muted)}
.day.on{background:linear-gradient(150deg,var(--red1),var(--red2));border-color:rgba(255,160,170,.6)}
.day.on small{color:#ffe3e6}
.day .today{display:block;font-size:9px;font-weight:700;color:var(--gold2);height:11px;line-height:11px}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy1);color:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:0 10px;min-width:0}
.search input{flex:1;background:none;border:0;outline:0;padding:9px 0;font-size:13.5px;min-width:0}
.search input::placeholder{color:var(--dim)}
.search svg{width:17px;height:17px;opacity:.7;flex:none}
.fbtn{display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:12px;font-weight:700;font-size:13px;background:linear-gradient(150deg,var(--red1),var(--red2));position:relative}
.fbtn svg{width:17px;height:17px}
.fbtn .n{background:var(--gold);color:#1a1200;border-radius:9px;font-size:10.5px;min-width:18px;height:18px;display:grid;place-items:center}
.favbtn{width:40px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.favbtn svg{width:19px;height:19px}
.favbtn.on{background:var(--gold);border-color:var(--gold);color:#1a1200}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.count{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:2px 2px 6px}
.count button{color:var(--gold2);font-weight:600;text-decoration:underline}
.tgroup{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-family:var(--head);font-weight:800;font-size:18px;font-style:italic}
.tgroup::after{content:"";flex:1;height:1px;background:var(--line)}
.tgroup .nowtag{font-family:var(--body);font-style:normal;font-size:10px;font-weight:700;background:var(--live);padding:2px 7px;border-radius:8px}
.ev{display:block;width:100%;text-align:left;border-radius:var(--radius);padding:10px 11px;margin-bottom:8px;background:linear-gradient(160deg,var(--navy1),var(--navy2));border:1px solid var(--line);position:relative;overflow:hidden}
.ev:active{transform:scale(.99)}
.ev.live{border-color:rgba(255,80,95,.8);box-shadow:0 0 0 1px rgba(255,59,78,.4),0 6px 18px rgba(255,59,78,.18)}
.ev .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.ev .meta .sp{flex:1}
.ev .loc{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.08);border-radius:7px;padding:2px 6px;color:#e5ecff;text-transform:none;letter-spacing:0}
.ev .loc svg{width:11px;height:11px}
.st{font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;text-transform:uppercase;letter-spacing:.3px}
.st.live{background:var(--live);color:#fff;animation:pulse 1.4s infinite}
.st.fim{background:rgba(255,255,255,.12);color:#cfd8f5}
.st.prox{background:rgba(245,184,0,.16);color:var(--gold2)}
@keyframes pulse{50%{opacity:.55}}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:9px 0 6px}
.team{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;font-size:14px}
.team.r{flex-direction:row-reverse;text-align:right}
.team span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.win span{color:var(--gold2)}
.team.tbd span{color:var(--dim);font-weight:600;font-size:12.5px;white-space:normal;line-height:1.15}
.score{font-family:var(--head);font-weight:800;font-size:24px;display:flex;align-items:center;gap:6px;min-width:62px;justify-content:center}
.score i{font-style:normal;color:var(--dim);font-size:15px}
.score.time{font-size:15px;color:var(--muted);font-weight:700}
.ev .phase{font-size:11.5px;color:var(--muted)}
.ev .star{position:absolute;right:8px;bottom:6px;width:30px;height:30px;display:grid;place-items:center;color:var(--dim)}
.ev .star svg{width:18px;height:18px}
.ev .star.on{color:var(--gold)}
.ev.ativ{background:linear-gradient(150deg,#2a2a0a 0%,#3a2f05 0%, #1d2e66 0%, #10265c 100%);border-color:rgba(245,184,0,.45)}
.ev.ativ::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.ev.festa{background:linear-gradient(150deg,#4b0b2e,#22134f);border-color:rgba(255,90,170,.45)}
.ev.festa::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--red1),#b04cff)}
.ev .title{font-weight:700;font-size:15px;margin:6px 0 3px;padding-right:26px}
.ev .desc{font-size:12px;color:#cdd8f5;line-height:1.35;padding-right:26px}
.typetag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;letter-spacing:.4px}
.typetag.ativ{background:var(--gold);color:#1a1200}
.typetag.festa{background:linear-gradient(90deg,var(--red1),#b04cff);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty b{display:block;font-family:var(--head);font-style:italic;font-size:22px;color:#fff;margin-bottom:6px}

/* badge (shield) */
.bdg{width:var(--s,30px);height:var(--s,30px);flex:none;position:relative;display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--head);letter-spacing:-.2px}
.bdg svg{position:absolute;inset:0;width:100%;height:100%}
.bdg b{position:relative;font-size:calc(var(--s,30px) * .30);text-shadow:0 1px 1px rgba(0,0,0,.6);line-height:1}

/* sheet */
.sheet-wrap{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(2,6,20,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{background:linear-gradient(180deg,#132c6a,#0a1a44);border-top:1px solid var(--line);border-radius:22px 22px 0 0;max-height:88%;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .22s}
.sheet-wrap.open .sheet{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:8px auto 2px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px}
.sheet .sh .ptitle{font-size:22px}
.sheet .sb{overflow-y:auto;padding:0 16px 16px}
.sheet .sf{display:flex;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);border-top:1px solid var(--line)}
.fgroup{margin-bottom:14px}
.fgroup h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.fgroup .opts{display:flex;flex-wrap:wrap;gap:6px}
.btn{flex:1;border-radius:13px;padding:13px 14px;font-weight:700;font-size:14px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:linear-gradient(150deg,var(--red1),var(--red2))}
.btn.gold{background:linear-gradient(140deg,var(--gold2),var(--gold));color:#1a1200}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}

.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin:8px 0 14px}
.board .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.board .tm small{color:var(--muted);font-weight:500;font-size:11px}
.board .sc{font-family:var(--head);font-weight:900;font-size:44px;line-height:1}
.board .sc i{font-style:normal;color:var(--dim);font-size:26px;margin:0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.kv span{color:var(--muted)}

/* list rows */
.panel{background:linear-gradient(160deg,var(--navy1),var(--navy2));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid rgba(120,170,255,.14);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:14px}
.row .grow small{color:var(--muted);font-size:11.5px}
.row svg.ic{width:20px;height:20px;flex:none;color:var(--gold)}
.row .chev{width:16px;height:16px;opacity:.6}
table.rank{width:100%;border-collapse:collapse;font-size:13px}
table.rank th{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;padding:8px 4px;text-align:center}
table.rank th:nth-child(2){text-align:left}
table.rank td{padding:8px 4px;text-align:center;border-top:1px solid rgba(120,170,255,.14)}
table.rank td.tn{text-align:left}
table.rank td.tn div{display:flex;align-items:center;gap:8px;font-weight:700}
table.rank td.tn small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
table.rank td.pos{font-family:var(--head);font-weight:800;font-size:17px;font-style:italic;width:26px}
table.rank tr.top1 td.pos{color:var(--gold)} table.rank tr.top2 td.pos{color:#d6dce8} table.rank tr.top3 td.pos{color:#e09a5a}
table.rank td.pts{font-weight:800;color:var(--gold2)}
table.rank tr.q td{background:rgba(47,208,122,.06)}
.gtitle{font-family:var(--head);font-style:italic;font-weight:800;font-size:16px;text-transform:uppercase;padding:9px 12px 0}

/* misc screens */
.ticket{border-radius:18px;overflow:hidden;background:linear-gradient(150deg,var(--red1),var(--red2));position:relative;margin-bottom:14px;border:1px solid rgba(255,160,170,.5)}
.ticket .tt{padding:16px}
.ticket .tt small{color:#ffe3e6;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.ticket .tt h2{margin:2px 0 4px;font-family:var(--head);font-style:italic;font-weight:900;font-size:28px;text-transform:uppercase}
.ticket .tb{background:#fff;color:#0a1a44;display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:2px dashed rgba(10,26,68,.3)}
.ticket .tb .qr{padding:0}
.ecard{border-radius:18px;aspect-ratio:1.6;padding:18px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,#1a3a8f,#0b1d4f 55%,#06102a);border:2px solid var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.4);margin-bottom:14px}
.ecard::before{content:"";position:absolute;right:-40px;top:-10px;bottom:-10px;width:55%;transform:skewX(-20deg);background:linear-gradient(90deg,var(--gold) 0 18%,transparent 18% 26%,var(--red1) 26% 60%,transparent 60%)}
.ecard .brand{position:relative;font-family:var(--head);font-weight:900;font-style:italic;font-size:15px;letter-spacing:.6px}
.ecard .nm{position:relative;font-family:var(--head);font-weight:900;font-style:italic;font-size:38px;color:var(--gold);line-height:1;margin-top:6px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.ecard .bal{position:absolute;left:18px;bottom:16px}
.ecard .bal small{font-size:11px;color:var(--muted)}
.ecard .bal b{display:block;font-family:var(--head);font-size:30px;font-weight:800}
.ecard .num{position:absolute;right:18px;bottom:18px;font-size:12px;letter-spacing:1.5px;opacity:.9}
.news{display:flex;gap:12px;padding:12px;border-bottom:1px solid rgba(120,170,255,.14)}
.news:last-child{border-bottom:0}
.news .th{width:84px;height:70px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:30px}
.news b{display:block;font-size:14px;line-height:1.25;margin-bottom:4px}
.news small{color:var(--muted);font-size:11.5px}
.chatlog{display:flex;flex-direction:column;gap:8px;padding:6px 0 12px;min-height:calc(100% - 140px)}
.msg{max-width:80%;padding:8px 11px;border-radius:14px;font-size:13.5px;line-height:1.35;background:rgba(255,255,255,.08);border:1px solid var(--line);align-self:flex-start}
.msg small{display:block;font-size:10.5px;color:var(--gold2);font-weight:700;margin-bottom:2px}
.msg.me{align-self:flex-end;background:linear-gradient(150deg,var(--red1),var(--red2));border-color:transparent}
.chatbar{position:sticky;bottom:0;margin:0 -14px;padding:10px 12px;display:flex;gap:8px;background:linear-gradient(180deg,rgba(6,16,42,0),var(--bg0) 35%);z-index:10}
.chatbar input{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:22px;padding:11px 14px;outline:0}
.chatbar button{width:44px;border-radius:22px;background:linear-gradient(150deg,var(--red1),var(--red2));display:grid;place-items:center}
.chatbar button svg{width:18px;height:18px}
.toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,20px);background:#fff;color:#0a1a44;font-weight:600;font-size:13px;padding:10px 16px;border-radius:12px;z-index:80;opacity:0;transition:.2s;pointer-events:none;max-width:86%;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.map{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:var(--radius);padding:8px;margin-bottom:12px}
.map svg{width:100%;height:auto;display:block}
.map .spot{cursor:pointer}
.map .spot:hover rect,.map .spot.sel rect{stroke:var(--gold);stroke-width:2.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);margin:0 2px 12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.bigqr{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:10px 0}
.bigqr .qr{padding:16px;border-radius:18px}
.bigqr .url{font-family:var(--head);font-weight:700;font-size:18px;color:var(--gold2);word-break:break-all}
.note{font-size:11.5px;color:var(--dim);text-align:center;margin:14px 0 4px}
</style>

function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const toMin = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const hhmm = m => String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

function addGame(o){ const e = Object.assign({ tipo:'jogo', dur:60 }, o); e.id = 'j'+(++seq); EVENTS.push(e); KEYS[e.mod+'-'+e.gen].games.push(e); return e; }

MODS.forEach(m=>GENS.forEach(g=>{
  const key = m.id+'-'+g.id, r = rng(hashStr(key));
  const t = shuffle(FACS.map(f=>f.id), r);
  KEYS[key] = { mod:m.id, gen:g.id, groups:{ A:t.slice(0,4), B:t.slice(4,8), C:t.slice(8,12) }, games:[] };
}));

const SLOTS = ['09:00','10:00','11:00','14:00','15:00','16:00'].map(toMin);
const ROUNDS = [[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
MODS.forEach(m=>{
  for (let d=1; d<=3; d++){
    const per = { f:[], m:[] };
    GENS.forEach(g=>{
      const K = KEYS[m.id+'-'+g.id];
      ['A','B','C'].forEach(G=>ROUNDS[d-1].forEach(([i,j])=>per[g.id].push({ grupo:G, a:K.groups[G][i], b:K.groups[G][j] })));
    });
    for (let s=0; s<6; s++) ['f','m'].forEach((gid,ci)=>{
      const x = per[gid][s];
      addGame({ dia:d, ini:SLOTS[s], mod:m.id, gen:gid, fase:'grupos', grupo:x.grupo, rodada:d, a:x.a, b:x.b, local:'q'+m.quadras[(ci+d)%2] });
    });
  }
  const q = m.quadras;
  ['f','m'].forEach((gid,gi)=>{
    const qfBase = gi===0 ? toMin('08:00') : toMin('10:00');
    for (let k=0;k<4;k++) addGame({ dia:4, ini:qfBase+Math.floor(k/2)*60, mod:m.id, gen:gid, fase:'qf', n:k+1, local:'q'+q[k%2] });
    const sf = gi===0 ? toMin('13:00') : toMin('14:00');
    for (let k=0;k<2;k++) addGame({ dia:4, ini:sf, mod:m.id, gen:gid, fase:'sf', n:k+1, local:'q'+q[k] });
    addGame({ dia:4, ini:toMin('15:00'), mod:m.id, gen:gid, fase:'3', local:'q'+q[gi] });
    addGame({ dia:4, ini:gi===0 ? toMin('16:00') : toMin('17:00'), mod:m.id, gen:gid, fase:'f', local:'q'+q[0] });
  });
});

/* Placar final determinístico por jogo */
function finalScore(e){
  const r = rng(hashStr(e.id+e.mod+e.gen)), ko = e.fase!=='grupos';
  let a,b,extra='';
  if (e.mod==='volei'){ const w=r()<.5; const l=r()<.45?1:0; a=w?2:l; b=w?l:2; }
  else {
    const base = { futsal:[0,6], handebol:[17,15], basquete:[46,40] }[e.mod];
    a = base[0] + Math.floor(r()*base[1]); b = base[0] + Math.floor(r()*base[1]);
    if (e.mod==='futsal'){ a=Math.floor(r()*6); b=Math.floor(r()*6); }
    if (e.mod==='basquete' && a===b) a+=2;
    if (ko && a===b){ if (r()<.5) a+=1; else b+=1; extra = e.mod==='futsal' ? 'Pênaltis' : 'Prorrogação'; }
  }
  return { a, b, extra };
}
EVENTS.forEach(e=>{ if (e.tipo==='jogo') e.sc = finalScore(e); });
const winnerOf = e => e.sc.a>e.sc.b ? e.a : e.sc.b>e.sc.a ? e.b : null;
const loserOf  = e => e.sc.a>e.sc.b ? e.b : e.a;

function standings(key, onlyDone){
  const K = KEYS[key], tab = {};
  Object.entries(K.groups).forEach(([G,ts])=>ts.forEach(t=>tab[t]={ t, G, j:0, v:0, e:0, d:0, pf:0, pc:0, pts:0 }));
  K.games.filter(g=>g.fase==='grupos' && (!onlyDone || status(g)==='fim')).forEach(g=>{
    const A=tab[g.a], B=tab[g.b];
    A.j++; B.j++; A.pf+=g.sc.a; A.pc+=g.sc.b; B.pf+=g.sc.b; B.pc+=g.sc.a;
    if (g.sc.a>g.sc.b){ A.v++; B.d++; A.pts+=3; } else if (g.sc.b>g.sc.a){ B.v++; A.d++; B.pts+=3; } else { A.e++; B.e++; A.pts++; B.pts++; }
  });
  const sortFn = (x,y)=> y.pts-x.pts || (y.pf-y.pc)-(x.pf-x.pc) || y.pf-x.pf || x.t.localeCompare(y.t);
  const groups = {};
  Object.keys(K.groups).forEach(G=>groups[G]=Object.values(tab).filter(r=>r.G===G).sort(sortFn));
  return { groups, sortFn };
}
/* Resolve o mata-mata (times reais) a partir da fase de grupos */
Object.keys(KEYS).forEach(key=>{
  const K = KEYS[key], { groups, sortFn } = standings(key,false);
  const thirds = ['A','B','C'].map(G=>groups[G][2]).sort(sortFn);
  const P = { '1A':groups.A[0].t,'1B':groups.B[0].t,'1C':groups.C[0].t,'2A':groups.A[1].t,'2B':groups.B[1].t,'2C':groups.C[1].t,'3x':thirds[0].t,'3y':thirds[1].t };
  const qf = K.games.filter(g=>g.fase==='qf'), sf = K.games.filter(g=>g.fase==='sf');
  const third = K.games.find(g=>g.fase==='3'), fin = K.games.find(g=>g.fase==='f');
  const QF = [['1A','3y','1º Grupo A','2º melhor 3º'],['2B','2C','2º Grupo B','2º Grupo C'],['1B','3x','1º Grupo B','Melhor 3º'],['1C','2A','1º Grupo C','2º Grupo A']];
  qf.forEach((g,i)=>{ g.a=P[QF[i][0]]; g.b=P[QF[i][1]]; g.pa=QF[i][2]; g.pb=QF[i][3]; g.dep=K.games.filter(x=>x.fase==='grupos'); });
  sf.forEach((g,i)=>{ const x=qf[i*2], y=qf[i*2+1]; g.a=winnerOf(x); g.b=winnerOf(y); g.pa='Venc. QF'+(i*2+1); g.pb='Venc. QF'+(i*2+2); g.dep=[x,y]; });
  third.a=loserOf(sf[0]); third.b=loserOf(sf[1]); third.pa='Perd. SF1'; third.pb='Perd. SF2'; third.dep=sf;
  fin.a=winnerOf(sf[0]); fin.b=winnerOf(sf[1]); fin.pa='Venc. SF1'; fin.pb='Venc. SF2'; fin.dep=sf;
  K.third = third; K.fin = fin;
});
EVENTS.sort((x,y)=> x.dia-y.dia || x.ini-y.ini || (x.tipo==='jogo')-(y.tipo==='jogo') || (x.local||'').localeCompare(y.local||'', 'pt', {numeric:true}));

  set(k,v){ try{ localStorage.setItem('ic_'+k, JSON.stringify(v)); }catch(_){} },

let NOW = NOW_PRESETS.find(p=>p.id===store.get('now','2-1520')) || NOW_PRESETS[1];
const nowAbs = () => NOW.dia*1440 + NOW.min;
function status(e){ const s=e.dia*1440+e.ini, n=nowAbs(); return n>=s+e.dur ? 'fim' : n>=s ? 'live' : 'prox'; }
function known(e){ return e.fase==='grupos' || e.dep.every(d=>status(d)==='fim'); }
function shownScore(e){
  const st = status(e);
  if (st==='fim') return { a:e.sc.a, b:e.sc.b };
  if (st!=='live') return null;
  const f = Math.min(.95, (nowAbs()-(e.dia*1440+e.ini))/e.dur);
  if (e.mod==='volei'){ const w=e.sc.a>e.sc.b?'a':'b', l=w==='a'?'b':'a'; const seq=e.sc[l]===1?[w,l,w]:[w,w]; const done=Math.floor(f*seq.length); const o={a:0,b:0}; seq.slice(0,done).forEach(s=>o[s]++); return o; }
  return { a:Math.floor(e.sc.a*f), b:Math.floor(e.sc.b*f) };
}

  const { path, params } = parseHash();

const F = { dia:NOW.dia, fac:new Set(), mod:new Set(), gen:new Set(), tipo:new Set(), local:new Set(), q:'', fav:false };
function readFilters(p){
  const d = p.get('dia'); F.dia = d==='all' ? 'all' : d ? +d : (F.dia||NOW.dia);
  ['fac','mod','gen','tipo','local'].forEach(k=>{ F[k] = new Set((p.get(k)||'').split(',').filter(Boolean)); });
  F.q = p.get('q')||''; F.fav = p.get('fav')==='1';
}
function filtersQS(extra={}){
  const p = new URLSearchParams();
  p.set('dia', F.dia);
  ['fac','mod','gen','tipo','local'].forEach(k=>{ if (F[k].size) p.set(k,[...F[k]].join(',')); });
  if (F.q) p.set('q',F.q); if (F.fav) p.set('fav','1');
  Object.entries(extra).forEach(([k,v])=>p.set(k,v));
  return p.toString().replace(/%2C/g,',');
}
function syncUrl(){ history.replaceState(null,'','#/cronograma?'+filtersQS()); }
function matches(e, ignoreDia){
  if (!ignoreDia && F.dia!=='all' && e.dia!==F.dia) return false;
  if (F.tipo.size && !F.tipo.has(e.tipo)) return false;
  if (F.local.size && !F.local.has(e.local)) return false;
  const nonGameOk = e.tipo!=='jogo' && F.tipo.has(e.tipo);
  if (F.mod.size && !(e.tipo==='jogo' ? F.mod.has(e.mod) : nonGameOk)) return false;
  if (F.gen.size && !(e.tipo==='jogo' ? F.gen.has(e.gen) : nonGameOk)) return false;
  if (F.fac.size){
    if (e.tipo==='jogo'){ const t=teamsOf(e); if (!(F.fac.has(t.a)||F.fac.has(t.b))) return false; }
    else if (!nonGameOk) return false;
  }
  if (F.fav && !FAV.has(e.id)) return false;
  if (F.q){
    const q = F.q.toLowerCase();
    const t = e.tipo==='jogo' ? [evTitle(e), faseNome(e), LOCAL[e.local].nome, ...(Object.values(teamsOf(e)).filter(Boolean).flatMap(id=>[FAC[id].sigla,FAC[id].atl,FAC[id].nome]))].join(' ') : [e.titulo,e.desc,LOCAL[e.local].nome].join(' ');
    if (!t.toLowerCase().includes(q)) return false;
  }
  return true;
}
const nActive = () => F.fac.size+F.mod.size+F.gen.size+F.tipo.size+F.local.size;

function evCard(e){

  if (e.tipo!=='jogo'){
    return `<button class="ev ${e.tipo}" data-ev="${e.id}">
      <div class="meta"><span class="typetag ${e.tipo}">${e.tipo==='ativ'?'⚡ ATIVAÇÃO':'🎉 FESTA'}</span><span class="sp"></span>${loc}</div>

  const mid = s ? `<div class="score">${s.a}<i>×</i>${s.b}</div>` : `<div class="score time">vs</div>`;
  return `<button class="ev ${st==='live'?'live':''}" data-ev="${e.id}">
    <div class="meta"><span>${MOD[e.mod].emoji} ${MOD[e.mod].nome} · ${GEN[e.gen].nome.slice(0,3)}</span><span class="sp"></span>${loc}${stTag}</div>
    <div class="match">${side(t.a,e.pa,wa,false)}${mid}${side(t.b,e.pb,wb,true)}</div>
    <div class="phase">${faseNome(e)}${st==='fim'&&e.sc.extra?' · '+e.sc.extra:''}</div>
    ${star}</button>`;
}

function chipsHtml(){
  const out = [];
  const add = (k,id,label,dot) => out.push(`<button class="pill on" data-rm="${k}:${id}">${dot?`<span class="dot" style="background:${dot}"></span>`:''}${label}<span class="x">✕</span></button>`);
  F.tipo.forEach(id=>add('tipo',id,TIPOS.find(t=>t.id===id).nome));
  F.mod.forEach(id=>add('mod',id,MOD[id].emoji+' '+MOD[id].nome));
  F.gen.forEach(id=>add('gen',id,GEN[id].nome));
  F.fac.forEach(id=>add('fac',id,FAC[id].sigla,FAC[id].cor));
  F.local.forEach(id=>add('local',id,LOCAL[id].nome));
  return out.length ? `<div class="chips">${out.join('')}</div>` : '';
}

      <button class="favbtn ${F.fav?'on':''}" data-favf aria-label="Minha agenda">${F.fav?I.star:I.starO}</button>

    </div>

  if (!list.length){
    html += `<div class="empty"><b>Nada por aqui</b>Nenhum evento com esses filtros${F.dia!=='all'?' neste dia':''}.${F.dia!=='all'?'<br><br><button class="pill" data-dia="all">Ver todos os dias</button>':''}</div>`;
  } else {
    let curKey = null;
    list.forEach(e=>{
      const key = (F.dia==='all' ? e.dia+'|' : '') + e.ini;

}

function generalRanking(){
  const tab = {}; FACS.forEach(f=>tab[f.id]={ t:f.id, j:0, v:0, e:0, d:0, o:0, p:0, b:0, pts:0 });
  EVENTS.filter(e=>e.tipo==='jogo' && status(e)==='fim').forEach(e=>{
    const A=tab[e.a], B=tab[e.b]; A.j++; B.j++;
    if (e.sc.a>e.sc.b){ A.v++; B.d++; A.pts+=3; } else if (e.sc.b>e.sc.a){ B.v++; A.d++; B.pts+=3; } else { A.e++; B.e++; A.pts++; B.pts++; }
  });
  Object.values(KEYS).forEach(K=>{
    if (status(K.fin)==='fim'){ tab[winnerOf(K.fin)].o++; tab[loserOf(K.fin)].p++; tab[winnerOf(K.fin)].pts+=15; tab[loserOf(K.fin)].pts+=10; }
    if (status(K.third)==='fim'){ tab[winnerOf(K.third)].b++; tab[winnerOf(K.third)].pts+=6; }
  });
  return Object.values(tab).sort((x,y)=>y.pts-x.pts || y.o-x.o || y.p-x.p || y.b-x.b || y.v-x.v || x.t.localeCompare(y.t));
}

function openSpot(id){
  if (id==='food'){ openSheet(`<div class="sh"><div class="ptitle">Praça de Alimentação</div><button class="iconbtn" data-close>${I.x}</button></div><div class="sb"><p style="color:#dbe4ff;line-height:1.5">Food trucks, hidratação e pontos de recarga do Energy Card. Aberta das 08:00 às 20:00.</p></div>`); return; }
  const l = LOCAL[id];
  const here = EVENTS.filter(e=>e.local===id && e.dia===NOW.dia);
  const now = here.filter(e=>status(e)==='live'), next = here.filter(e=>status(e)==='prox').slice(0,2);
  const line = e => e.tipo==='jogo' ? (()=>{ const t=teamsOf(e); return `${hhmm(e.ini)} · ${evTitle(e)} — ${t.a?FAC[t.a].sigla:e.pa} × ${t.b?FAC[t.b].sigla:e.pb}`; })() : `${hhmm(e.ini)} · ${esc(e.titulo)}`;
  const m = l.tipo==='quadra' ? MODS.find(m=>m.quadras.includes(+id.slice(1))) : null;
  openSheet(`<div class="sh"><div class="ptitle">${l.nome}</div><button class="iconbtn" data-close>${I.x}</button></div>
    <div class="sb">${m?`<p style="color:var(--muted);margin:0 0 10px">${m.emoji} Quadra de ${m.nome}</p>`:''}
      <div class="panel">
        <div class="row"><span class="st live">Agora</span><div class="grow"><b style="font-size:13px">${now.length?now.map(line).join('<br>'):'Nada acontecendo neste momento'}</b></div></div>
        <div class="row"><span class="st prox">Próximo</span><div class="grow"><b style="font-size:13px">${next.length?next.map(line).join('<br>'):'Sem mais eventos hoje'}</b></div></div>
      </div></div>
    <div class="sf"><a class="btn primary" href="#/cronograma?dia=${NOW.dia}&local=${id}">${I.events.replace('<svg','<svg width="18" height="18"')}Ver cronograma deste local</a></div>`);
}
